name: Publish retained approved V2 pilot image
on:
  push:
    branches: [codex/index-v2-pilot-image-2026-09-22]
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish-retained-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify retained artifact and publish exact image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SHA=f2ae2e8ebdba902eead2aa376e845da530259c4e
          IMAGE_ID=sha256:5d64ab78d3f73a96978f4cd2910c306247aec1382e40e676d33418b4b1232a38
          DEST=ghcr.io/devonwaldrop01/storescout-index-v2:$SHA
          gh api repos/Devonwaldrop01/StoreScout/actions/runs/35659744465 > run.json
          python -c 'import json; r=json.load(open("run.json")); assert r["head_sha"]=="f2ae2e8ebdba902eead2aa376e845da530259c4e" and r["conclusion"]=="success"'
          gh api repos/Devonwaldrop01/StoreScout/actions/artifacts/10667206573/zip > artifact.zip
          echo '8a0c736c7da6dae0c4143476acd910eb73990cdb0739b6836eb7dca6e4696a32  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d retained
          echo '91b99f03751e94ec8e08dd50a01874afe5540955f2537c94fde5399be5aee43a  retained/image.tar.gz' | sha256sum -c -
          docker load -i retained/image.tar.gz
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          test "$(docker image inspect "$IMAGE_ID" --format '{{json .Config.Cmd}}')" = '["./scripts/store_index_v2.py"]'
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD/retained/inventory.json:/validation/inventory.json:ro" "$IMAGE_ID" python scripts/release_image_check.py verify /validation/inventory.json > source-check.json
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker tag "$IMAGE_ID" "$DEST"
          docker push "$DEST" | tee publication.txt
          docker image inspect "$DEST" > published-image.json
          test "$(docker image inspect "$DEST" --format '{{.Id}}')" = "$IMAGE_ID"
          docker logout ghcr.io
          printf 'Approved source: %s\nExact image: %s\n' "$SHA" "$IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$DEST" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-pilot-image-identity
          path: |
            published-image.json
            source-check.json
            publication.txt
          retention-days: 30
