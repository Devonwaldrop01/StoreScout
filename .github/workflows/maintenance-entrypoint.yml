name: Isolated maintenance entrypoint release validation
on:
  push:
    branches: [codex/maintenance-entrypoint-2026-09-16]
permissions:
  contents: read
concurrency:
  group: storescout-maintenance-entrypoint-validation
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build exact release and run regression schema TLS and hold checks
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/validate_release_image.sh
      - name: Validate standalone maintenance executable and held restoration
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 -B validation/maintenance_entrypoint/validate.py
      - name: Retain exact image and non-production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-entrypoint-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 14
