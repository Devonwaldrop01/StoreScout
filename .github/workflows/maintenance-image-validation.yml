name: Isolated maintenance command validation
on:
  push:
    branches: [codex/maintenance-image-validation-2026-09-10]
permissions:
  contents: read
  actions: read
concurrency:
  group: storescout-maintenance-image-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download and authenticate retained release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 validation/maintenance/download.py
      - name: Validate exact image and maintenance transitions offline
        run: python3 validation/maintenance/validate.py
      - name: Retain non-production validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-validation-${{ github.sha }}
          path: ${{ runner.temp }}/maintenance-evidence/
          if-no-files-found: error
          retention-days: 14
