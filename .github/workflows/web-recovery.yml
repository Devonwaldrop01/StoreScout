name: Isolated legacy Web recovery validation
on:
  push:
    branches: [codex/web-recovery-validation-2026-09-16]
permissions:
  contents: read
concurrency:
  group: storescout-web-recovery-validation
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: validation-source
      - name: Verify exact source and build unchanged Linux recovery image
        shell: bash
        run: |
          set -euo pipefail
          git -C validation-source fetch --no-tags --depth=1 origin 288223a2acb62bd6893e3370268f854bb2e16b12
          test "$(git -C validation-source rev-parse FETCH_HEAD)" = 288223a2acb62bd6893e3370268f854bb2e16b12
          mkdir -p "$RUNNER_TEMP/recovery-context" "$RUNNER_TEMP/recovery-evidence"
          git -C validation-source archive 288223a2acb62bd6893e3370268f854bb2e16b12 | tar -x -C "$RUNNER_TEMP/recovery-context"
          test ! -e "$RUNNER_TEMP/recovery-context/.env"
          docker build --platform linux/amd64 --label org.opencontainers.image.revision=288223a2acb62bd6893e3370268f854bb2e16b12 -t storescout-recovery:test "$RUNNER_TEMP/recovery-context"
      - name: Validate exact normal command and guarded idle runtime
        run: python3 -B validation-source/validation/web_recovery/validate.py
      - name: Retain image
        if: success()
        run: docker save storescout-recovery:test | gzip > "$RUNNER_TEMP/recovery-evidence/recovery-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-recovery-288223a
          path: ${{ runner.temp }}/recovery-evidence/
          retention-days: 14
          if-no-files-found: error
